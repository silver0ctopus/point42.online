<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Point 42 - Вход в Комплекс</title>
    <!-- Подключаем A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* Стили для всплывающего окна авторизации */
        #auth-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            color: #0ff;
            border: 2px solid #0ff;
            padding: 20px;
            display: block; /* Сделали видимым для теста */
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            box-shadow: 0 0 15px #0ff;
        }
        input {
            width: 80%;
            margin: 10px 0;
            background: #111;
            border: 1px solid #0ff;
            color: #fff;
            padding: 5px;
        }
        button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 1. Supabase временно отключен -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->

    <!--================================================-->
    <!-- Интерфейс авторизации -->
    <div id="auth-ui" class="terminal-card">
        <h3 id="auth-title">АВТОРИЗАЦИЯ ТЕРМИНАЛА</h3>
        
        <div class="actions-group" style="margin-top: 15px;">
            <!-- Навесили открывание дверей напрямую на кнопку -->
            <button id="btn-guest" onclick="window.openDoors()" style="width: 100%; padding: 15px; font-size: 16px;">
                🔑 ГОСТЕВОЙ ПРОПУСК
            </button>
        </div>

        <div id="auth-status" class="status-msg" style="margin-top: 10px; font-size: 12px; color: #888;">
            Режим разработчика (Без базы данных)
        </div>
    </div>
    <!--================================================-->

    <a-scene background="color: #000">
        
        <!-- 1. КАБИНА ЛИФТА -->
        <a-box position="0 1.5 0" width="3" height="5" depth="4" material="color: #222; side: back; metalness: 0.6; roughness: 0.4"></a-box>
        
        <!-- Пол и потолок -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="3" height="4" color="#111"></a-plane>
        <a-plane position="0 4.99 0" rotation="90 0 0" width="3" height="4" color="#111"></a-plane>

        <!-- 2. ДВЕРИ ЛИФТА -->
        <a-entity id="elevator-doors">
            <a-plane id="left-door" position="-0.76 1.5 -1.98" width="1.5" height="5" color="#444" material="metalness: 0.8; roughness: 0.2"></a-plane>
            <a-plane id="right-door" position="0.76 1.5 -1.98" width="1.5" height="5" color="#444" material="metalness: 0.8; roughness: 0.2"></a-plane>
        </a-entity>

        <!-- 3. ПАНЕЛЬ УПРАВЛЕНИЯ -->
        <a-entity rotation="0 270 0">
            <a-plane position="-1.25 1.85 -1.49" width="0.5" height="0.6" color="#333">
                <!-- Кнопка вызова (тоже привязана к openDoors) -->
                <a-sphere id="call-button" class="clickable" position="0 0 0" radius="0.08" color="red" 
                          onclick="window.openDoors()"
                          animation__click="property: material.color; from: #f00; to: #0f0; dur: 200; startEvents: click">
                </a-sphere>
            </a-plane>
        </a-entity>
        <a-entity text="value: ENTER; align: center; width: 2" position="1.32 1.8 -1" rotation="0 -90 0"></a-entity>

        <!-- 4. ОСВЕЩЕНИЕ -->
        <a-light type="ambient" color="#444"></a-light>
        <a-light id="lift-light" type="point" position="0 2.5 0" intensity="0.8" color="#0ff"></a-light>

        <!-- 5. КАМЕРА И КУРСОР -->
        <a-entity id="rig" position="0 1.6 1">
            <a-camera look-controls wasd-controls="enabled: false">
                <a-entity cursor="fuse: false; rayOrigin: mouse;"
                          raycaster="objects: .clickable">
                </a-entity>
            </a-camera>
        </a-entity>

    </a-scene>

<script>
    // Управление 3D-дверьми и переход в лобби
    window.openDoors = function() {
        // Скрываем плашку авторизации, чтобы не мешала обзору
        const authUi = document.getElementById('auth-ui');
        if (authUi) authUi.style.display = 'none';

        const leftDoor = document.getElementById('left-door');
        const rightDoor = document.getElementById('right-door');

        leftDoor.setAttribute('animation', 'property: position; to: -2.2 1.5 -1.98; dur: 2000; easing: easeInQuad');
        rightDoor.setAttribute('animation', 'property: position; to: 2.2 1.5 -1.98; dur: 2000; easing: easeInQuad');

        setTimeout(() => {
            window.location.href = 'lobby.html' + "?from=" + window.location.pathname.split('/').pop(); 
        }, 2500);
    }

    window.onload = () => {
        console.log("Лифт прибывает в режиме Гостя...");
    };
</script>

    <!-- Временно закомментировали авторизацию -->
    <!-- <script src="./js/auth.js" type="module"></script> -->
</body>
</html>
